name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  FOUNDRY_PROFILE: ci

jobs:
  test:
    name: Foundry Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure swap for memory-intensive compilation
        run: |
          sudo fallocate -l 4G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          echo "Swap configured:"
          free -h

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.4.2
          cache: true

      - name: Cache Foundry build
        uses: actions/cache@v4
        with:
          path: |
            cache/
            out/
          key: foundry-build-${{ hashFiles('foundry.toml', 'src/**/*.sol', 'test/**/*.sol', 'lib/**') }}
          restore-keys: |
            foundry-build-

      - name: Show Foundry version
        run: forge --version

      - name: Run Forge build
        run: |
          forge --version
          forge build --sizes

      - name: Run Forge tests
        run: |
          forge test -vv

      - name: Run security tests
        run: |
          forge test --match-contract CoreSecurityVerification

  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.4.2

      - name: Run gas report
        run: forge test --gas-report

  coverage:
    name: Test Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.4.2

      - name: Run coverage
        run: forge coverage --ir-minimum --report lcov
        continue-on-error: true

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: github.event.pull_request.head.repo.fork == false
        with:
          files: ./lcov.info
          flags: foundry
          token: ${{ secrets.CODECOV_TOKEN }}
        continue-on-error: true

  snapshot:
    name: Gas Snapshot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.4.2

      - name: Generate gas snapshot
        run: forge snapshot

      - name: Compare gas snapshot (PR only)
        if: github.event_name == 'pull_request'
        run: forge snapshot --check
        continue-on-error: true

      - name: Upload snapshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: gas-snapshot
          path: .gas-snapshot
          retention-days: 30
