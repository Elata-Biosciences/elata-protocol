name: Simulation Tests

on:
  push:
    branches: [main, vNext]
    paths:
      - 'sim/**'
      - 'src/**'
      - 'script/**'
  pull_request:
    branches: [main, vNext]
    paths:
      - 'sim/**'
      - 'src/**'
      - 'script/**'
  workflow_dispatch:

env:
  FOUNDRY_PROFILE: ci

jobs:
  smoke-tests:
    name: Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: sim/pnpm-lock.yaml

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly
          cache: true

      - name: Cache Foundry build
        uses: actions/cache@v4
        with:
          path: |
            cache/
            out/
          key: foundry-smoke-${{ hashFiles('foundry.toml', 'src/**/*.sol', 'lib/**') }}
          restore-keys: |
            foundry-smoke-

      - name: Install simulation dependencies
        working-directory: sim
        run: pnpm install --frozen-lockfile

      - name: Build contracts
        run: forge build src/ --sizes
        env:
          FOUNDRY_PROFILE: default

      - name: Run bootstrap smoke test
        working-directory: sim
        run: pnpm run smoke:bootstrap

      - name: Run app creation smoke test
        working-directory: sim
        run: pnpm run smoke:app

      - name: Run buy tokens smoke test
        working-directory: sim
        run: pnpm run smoke:buy

      - name: Run veELTA lock smoke test
        working-directory: sim
        run: pnpm run smoke:veelta

      - name: Run fee collection smoke test
        working-directory: sim
        run: pnpm run smoke:fees

      - name: Upload smoke test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-test-results
          path: sim/results/
          retention-days: 7

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: smoke-tests
    timeout-minutes: 45
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: sim/pnpm-lock.yaml

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly
          cache: true

      - name: Cache Foundry build
        uses: actions/cache@v4
        with:
          path: |
            cache/
            out/
          key: foundry-integration-${{ hashFiles('foundry.toml', 'src/**/*.sol', 'lib/**') }}
          restore-keys: |
            foundry-integration-
            foundry-smoke-

      - name: Install simulation dependencies
        working-directory: sim
        run: pnpm install --frozen-lockfile

      - name: Build contracts
        run: forge build src/ --sizes
        env:
          FOUNDRY_PROFILE: default

      - name: Run full ecosystem smoke test
        working-directory: sim
        run: pnpm run smoke:ecosystem

      - name: Run governance vote smoke test
        working-directory: sim
        run: pnpm run smoke:governance

      - name: Run attack resistance smoke test
        working-directory: sim
        run: pnpm run smoke:adversarial

      - name: Validate metrics thresholds
        working-directory: sim
        run: |
          echo "Validating simulation results..."
          # Check that results directory exists
          if [ -d "results" ]; then
            echo "Results directory found"
            ls -la results/
          else
            echo "Warning: No results directory found"
          fi

      - name: Upload integration test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-results
          path: sim/results/
          retention-days: 7

  typecheck:
    name: Typecheck Simulation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: sim/pnpm-lock.yaml

      - name: Install simulation dependencies
        working-directory: sim
        run: pnpm install --frozen-lockfile

      - name: Run typecheck
        working-directory: sim
        run: pnpm run typecheck

  lint:
    name: Lint Simulation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: sim/pnpm-lock.yaml

      - name: Install simulation dependencies
        working-directory: sim
        run: pnpm install --frozen-lockfile

      - name: Run lint
        working-directory: sim
        run: pnpm run lint || echo "Lint warnings found (non-blocking)"

  full-ecosystem:
    name: Full Ecosystem Simulation
    runs-on: ubuntu-latest
    needs: smoke-tests
    timeout-minutes: 60
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: sim/pnpm-lock.yaml

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Install simulation dependencies
        working-directory: sim
        run: pnpm install --frozen-lockfile

      - name: Build contracts
        run: forge build --sizes

      - name: Run full ecosystem simulation
        working-directory: sim
        run: pnpm exec tsx scenarios/full-ecosystem.ts
        timeout-minutes: 45

      - name: Generate simulation report
        working-directory: sim
        run: pnpm exec tsx scripts/generate-simulation-report.ts ./simulation-results/full-ecosystem/metrics.json ./simulation-results/full-ecosystem/reports

      - name: Upload simulation results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-ecosystem-results
          path: |
            sim/simulation-results/full-ecosystem/
          retention-days: 30

      - name: Upload simulation report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulation-report
          path: |
            sim/simulation-results/full-ecosystem/reports/
          retention-days: 90
